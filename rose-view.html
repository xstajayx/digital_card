<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f2e8">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>Your flower gift · Silent Hello Flowers</title>
    <link rel="icon" href="./assets/favicon.svg">
    <link rel="stylesheet" href="./assets/fonts.css">
    <link rel="stylesheet" href="./assets/flowers.css">
    <script type="module" src="./app/flower-view.js"></script>
  </head>
  <body>
    <a class="flower-skip" href="#main">Skip to content</a>
    <header class="flower-header">
      <a class="flower-brand" href="./flowers.html">Silent Hello <span>Flowers</span></a>
      <a href="./">Greeting cards</a>
    </header>
    <main id="main" class="flower-recipient" tabindex="-1">
      <article id="flowerGift" class="flower-presentation" hidden>
        <h1 data-title></h1>
        <div class="flower-present-art" data-art></div>
        <div class="flower-gift-details">
          <button class="flower-button primary" data-bloom type="button"></button>
          <p class="flower-status" data-status role="status"></p>
          <div class="flower-note" data-letter hidden>
          <p data-note="greeting" hidden></p>
          <p data-note="message" hidden></p>
          <p data-note="signature" hidden></p>
          </div>
        </div>
      </article>
      <p id="giftError" class="flower-error" role="alert"></p>
      <p class="flower-return"><a href="./flowers.html">Send a little beauty of your own</a></p>
    </main>
    <noscript><p class="flower-noscript">Enable JavaScript to use Silent Hello Flowers.</p></noscript>
  </body>
</html>
