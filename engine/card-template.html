<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../assets/fonts.css" />
    <link rel="stylesheet" href="./card-base.css" />
    <link rel="stylesheet" href="./physical-card.css" />
    <link id="themeStyles" rel="stylesheet" />
    <title>Your greeting card</title>
  </head>
  <body>
    <article class="card-root" id="cardRoot" aria-label="Greeting card">
      <div class="edge-decor" id="edgeDecor" aria-hidden="true"></div>
      <div class="card">
        <div class="text-panel">
          <div id="ageMark" class="age-mark" aria-hidden="true" hidden></div>
          <h1 class="headline" id="headline"></h1>
          <p class="message" id="message"></p>
          <p class="from" id="from"></p>
        </div>
        <figure class="sticker-zone" hidden>
          <img id="stickerImg" alt="" width="130" height="100" />
        </figure>
        <div id="giftBlock" class="gift-block" hidden>
          <a
            id="giftButton"
            class="gift-button"
            target="_blank"
            rel="noopener noreferrer"
            referrerpolicy="no-referrer"
            >A little gift for you →</a
          >
          <p id="giftDomain" class="gift-domain"></p>
        </div>
        <footer class="watermark" id="watermark">
          Made with love · Silent Hello
        </footer>
      </div>
      <div class="opening-effects" id="openingEffects" aria-hidden="true"></div>
      <div class="overflow-notice" id="overflowNotice" role="note" hidden>
        <span aria-hidden="true">✉</span>
        <strong>This message needs a little more room</strong>
        <p>All the words are safe. Read the full message below the card.</p>
      </div>
    </article>
    <script type="module" src="./card-renderer.js"></script>
  </body>
</html>
