<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Open Card</title>
    <style>
      body {
        margin: 0;
        font-family: Inter, system-ui, sans-serif;
        background: #f6f7ff;
        color: #2b2622;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 16px;
      }
      .actions {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin: 10px 0;
      }
      button {
        border: 1px solid #4f46e5;
        border-radius: 999px;
        padding: 0.58rem 0.9rem;
        background: #fff;
        color: #4f46e5;
        font-weight: 700;
        cursor: pointer;
      }
      .primary {
        background: #4f46e5;
        color: #fff;
      }
      .frame {
        border: 1px solid rgba(79, 70, 229, 0.18);
        border-radius: 18px;
        padding: 10px;
        background: #fff;
      }
      iframe {
        display: block;
        margin: auto;
        max-width: 420px;
        width: 100%;
        aspect-ratio: 3/5;
        border: 0;
        border-radius: 14px;
        background: #fff;
      }
      #status {
        min-height: 18px;
        color: #645f77;
        font-size: 0.88rem;
        margin-top: 10px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>You’ve received a card 🎉</h1>
      <div class="actions">
        <button id="replayButton" type="button">Replay</button>
        <button id="copyButton" type="button">Copy link</button>
        <button id="shareButton" class="primary" type="button">
          Share to WhatsApp
        </button>
      </div>
      <div class="frame">
        <iframe id="viewerFrame" title="Card viewer"></iframe>
      </div>
      <p id="fitStatus" role="status"></p>
      <div id="status" aria-live="polite"></div>
    </main>

    <script type="module" src="./app/viewer.js"></script>
    <script type="module" src="./app/frame-status.js"></script>
  </body>
</html>
