<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f7f3" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>A little card for you · Silent Hello</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./assets/fonts.css" />
    <link rel="stylesheet" href="./assets/app.css" />
    <link rel="stylesheet" href="./assets/recipient.css" />
  </head>
  <body class="viewer-page">
    <header class="site-header viewer-header">
      <a class="brand" href="./"
        ><span class="brand-mark" aria-hidden="true"
          ><svg viewBox="0 0 32 32" fill="none">
            <path
              d="m4 10 12-6 12 6v16H4Z"
              stroke="currentColor"
              stroke-width="1.5"
            />
            <path
              d="m4 11 12 9 12-9M4 26l9-9m15 9-9-9"
              stroke="currentColor"
              stroke-width="1.5"
            /></svg></span
        ><span
          ><strong>Silent Hello</strong></span
        ></a
      >
    </header>
    <main class="viewer-wrap">
      <section id="cardPresentation" aria-label="Your greeting card" hidden>
        <div id="openingAction" class="recipient-opening" aria-live="polite"></div>
        <div class="preview-card-frame">
          <iframe id="viewerFrame" title="Your personal greeting card"></iframe>
        </div>
        <p id="fitStatus" class="fit-status" role="status"></p>
        <details id="fullMessage" class="full-message" hidden>
          <summary>Read comfortably</summary>
          <div id="fullMessageText"></div>
        </details>
        <div class="recipient-actions">
          <button id="replayButton" class="text-button" type="button" hidden>Replay opening</button>
        </div>
      </section>
      <section
        id="cardError"
        class="error-state"
        aria-labelledby="errorTitle"
        hidden
      >
        <span aria-hidden="true">✉</span>
        <h2 id="errorTitle">This card couldn’t be opened.</h2>
        <p id="errorReason"></p>
        <p>Ask the sender to copy the whole link and send it again.</p>
        <a class="button primary" href="./">Make a new card →</a>
      </section>
      <p id="status" class="viewer-status" role="status" aria-live="polite"></p>
      <p class="create-own"><a href="./">Send a little joy of your own →</a></p>
    </main>
    <noscript
      ><p class="noscript">
        Please enable JavaScript to open this card.
      </p></noscript
    >
    <script type="module" src="./app/viewer.js"></script>
  </body>
</html>
